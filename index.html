<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BACU CREATIVE</title>
<meta name="description" content="BACU CREATIVE — Dirección creativa, producción audiovisual y storytelling.">
<meta name="theme-color" content="#0A0C0A">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="bg-canvas" aria-hidden="true"></canvas>

<div id="intro" role="presentation">
  <div class="eye-wrap" id="eyeWrap">
    <img id="eye" src="assets/bacu-eye.png" alt="BACU" width="220" height="138">
    <div class="pupil" id="pupilIntro"></div>
  </div>

  <div id="introText">
    <h1 id="wordmark">BACU CREATIVE</h1>
    <p id="tagline">Qué energía. Gracias por tu tiempo.</p>
  </div>
</div>

<main id="content" aria-hidden="true">
  <header class="hub-header">
    <div class="mark-wrap" id="markWrap">
      <img class="mark" src="assets/bacu-eye.png" alt="BACU" width="64" height="40">
      <div class="pupil pupil--mark" id="pupilMark"></div>
    </div>
    <h1 class="hub-title">BACU CREATIVE</h1>
    <p class="hub-tagline">Qué energía. Gracias por tu tiempo.</p>
  </header>

  <nav class="links" aria-label="Enlaces">
    <a class="card card--featured" href="https://branntt.github.io/brant-portfolio/" target="_blank" rel="noopener">
      <span class="card-label">Portafolio</span>
      <span class="card-sub">Ver trabajo completo</span>
      <span class="card-arrow" aria-hidden="true">↗</span>
    </a>

    <a class="card" href="https://www.instagram.com/bacu_creative/" target="_blank" rel="noopener">
      <span class="card-label">@Bacu_creative</span>
      <span class="card-arrow" aria-hidden="true">↗</span>
    </a>

    <a class="card" href="https://www.instagram.com/branntt._/" target="_blank" rel="noopener">
      <span class="card-label">@Branntt._</span>
      <span class="card-arrow" aria-hidden="true">↗</span>
    </a>

    <a class="card" id="link-novena" href="https://www.instagram.com/novenacrew_" target="_blank" rel="noopener">
      <span class="card-label">@novenacrew_</span>
      <span class="card-arrow" aria-hidden="true">↗</span>
    </a>

    <a class="card" href="https://www.tiktok.com/@branntt" target="_blank" rel="noopener">
      <span class="card-label">TikTok</span>
      <span class="card-arrow" aria-hidden="true">↗</span>
    </a>

    <button class="card card--habits" id="btn-habits" type="button">
      <span class="card-label">Mis Hábitos</span>
      <span class="card-sub">Checklist semanal</span>
      <span class="card-arrow" aria-hidden="true">→</span>
    </button>
  </nav>

  <footer class="hub-footer">
    <span>© 2026 BACU CREATIVE</span>
  </footer>
</main>

<!-- ============ HABITS VIEW ============ -->
<section id="habits-view" class="habits-view" aria-hidden="true">
  <header class="habits-header">
    <button class="habits-back" id="habits-back" type="button" aria-label="Volver">
      <span aria-hidden="true">←</span>
    </button>
    <h2 class="habits-title">Mis Hábitos</h2>
    <span class="habits-week" id="habits-week"></span>
  </header>

  <div class="habits-progress-wrap">
    <div class="habits-progress-bar">
      <div class="habits-progress-fill" id="habits-progress-fill"></div>
    </div>
    <span class="habits-progress-text" id="habits-progress-text">0%</span>
  </div>

  <div class="habits-week-nav">
    <button class="habits-week-btn" id="week-prev" type="button" aria-label="Semana anterior">‹</button>
    <div class="habits-days" id="habits-days"></div>
    <button class="habits-week-btn" id="week-next" type="button" aria-label="Semana siguiente">›</button>
  </div>

  <ul class="habits-list" id="habits-list"></ul>

  <div class="habits-add-wrap">
    <input class="habits-input" id="habits-input" type="text" placeholder="Nuevo hábito…" maxlength="60" autocomplete="off">
    <button class="habits-add-btn" id="habits-add-btn" type="button">+</button>
  </div>

  <footer class="hub-footer">
    <span>S.A.O BACU — Hábitos</span>
  </footer>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="main.js"></script>
</body>
</html>
